name: Toolchain CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      luna_ref:
        description: Luna branch, tag, or commit used for conformance and integration
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: toolchain-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LUNA_FIXTURE_REF: ${{ inputs.luna_ref || 'main' }}

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            vscode-target: linux-x64
          - name: macOS
            runner: macos-15
            vscode-target: darwin-arm64
          - name: Windows
            runner: windows-2022
            vscode-target: win32-x64

    steps:
      - name: Check out LunaToolchain
        uses: actions/checkout@v6

      - name: Check out compatible Luna fixtures
        uses: actions/checkout@v6
        with:
          repository: Luna-PL/Luna
          ref: ${{ env.LUNA_FIXTURE_REF }}
          path: .ci/luna
          persist-credentials: false

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt

      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            editors/vscode/package-lock.json
            grammars/tree-sitter-luna/package-lock.json

      - name: Install Tree-sitter dependencies
        run: npm --prefix grammars/tree-sitter-luna ci

      - name: Install VS Code client dependencies
        run: npm --prefix editors/vscode ci

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Generate Tree-sitter parser
        run: npm --prefix grammars/tree-sitter-luna run generate

      - name: Check generated parser is committed
        run: git diff --exit-code -- grammars/tree-sitter-luna/src

      - name: Test Tree-sitter grammar
        run: npm --prefix grammars/tree-sitter-luna test

      - name: Check grammar against Luna fixtures
        run: npm --prefix grammars/tree-sitter-luna run test:compiler
        env:
          LUNA_SOURCE_DIR: ${{ github.workspace }}/.ci/luna

      - name: Check VS Code client sources
        run: npm --prefix editors/vscode run check

      - name: Check VS Code client dependencies
        run: npm --prefix editors/vscode ls --depth=0

      - name: Stage bundled editor binaries
        run: npm --prefix editors/vscode run stage:binaries

      - name: Smoke-test VSIX packaging
        run: npm --prefix editors/vscode run package:vsix -- --target ${{ matrix.vscode-target }} --out ../../luna-language-ci-${{ matrix.vscode-target }}.vsix

  compiler-integration:
    name: Luna compiler integration
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out LunaToolchain
        uses: actions/checkout@v6

      - name: Check out the selected Luna source
        uses: actions/checkout@v6
        with:
          repository: Luna-PL/Luna
          ref: ${{ env.LUNA_FIXTURE_REF }}
          path: .ci/luna
          persist-credentials: false

      - name: Install CMake, Ninja, and LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates cmake curl lsb-release ninja-build wget
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Build the selected Luna compiler
        run: |
          cmake -S .ci/luna -B .ci/luna-build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLUNA_STRICT_WARNINGS=ON \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm
          cmake --build .ci/luna-build --parallel

      - name: Verify compiler build identity
        run: ctest --test-dir .ci/luna-build -R '^luna.compiler-identity$' --output-on-failure

      - name: Run mandatory compiler-backed toolchain tests
        run: cargo test --workspace --locked
        env:
          LUNA_BIN: ${{ github.workspace }}/.ci/luna-build/luna
          LUNA_SOURCE_DIR: ${{ github.workspace }}/.ci/luna

      - name: Report selected compiler capabilities
        run: cargo run --locked -p luna-tools -- compiler --luna "${LUNA_BIN}"
        env:
          LUNA_BIN: ${{ github.workspace }}/.ci/luna-build/luna
