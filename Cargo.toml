[workspace]
members = [
    "crates/luna-compiler",
    "crates/luna-fmt",
    "crates/luna-lsp",
    "crates/luna-protocol",
    "crates/luna-tools",
    "crates/luna-workspace",
    "grammars/tree-sitter-luna",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tree-sitter = "0.26.11"
tree-sitter-language = "0.1.7"
